# Continuous integration.
#
# What this workflow is for, and what it deliberately is not:
#
#   - It builds, vets, formats-checks and tests on linux/amd64, runs the race
#     detector, cross-compiles the ARMv7 artefacts and proves the build is
#     reproducible, and renders the frontend in a real DOM.
#   - It does NOT test the target machine. No runner here is a onecloud, so
#     nothing in this workflow is evidence about ARMv7 runtime behaviour, memory
#     use on the target, or cgroup enforcement there. Those remain unverified
#     until somebody measures them on the machine, and docs/HUB-STAGE-B.md §7
#     lists them.
#
# Workflow definitions are not evidence of a completed run. Local verification
# and remaining target-machine checks are recorded in docs/COMPLETION-PLAN.md.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  # Manual runs, for when a branch needs checking without pushing.
  workflow_dispatch:

# Read-only by default. A build job has no business writing to the repository.
permissions:
  contents: read

# A newer push to the same branch makes an in-flight run obsolete. The ARMv7 job
# is the slow one, so cancelling it saves real time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The toolchain the module declares. Pinned so a runner image change cannot
  # silently move the build to a different Go version: the reproducibility check
  # depends on the compiler, and a floating version would make it fail for a
  # reason that has nothing to do with the code.
  GO_VERSION: "1.27.1"

jobs:
  # ---------------------------------------------------------------------------
  # The baseline: does it build, is it formatted, does it pass its tests.
  # ---------------------------------------------------------------------------
  test:
    name: build, vet, test (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # The module cache is keyed on go.sum, so a dependency change
          # re-populates it rather than reusing a stale cache.
          cache: true

      - name: Verify the module graph is tidy
        # A go.mod that does not match the imports is a build that works on one
        # machine and fails on the next. This catches it at the source.
        run: |
          go mod verify
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod or go.sum is not tidy; run 'go mod tidy' and commit the result"
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Build every package
        run: go build ./...

      - name: Vet
        # go vet catches the class of mistake a compiler accepts: a Printf verb
        # that does not match its argument, a lock copied by value, a struct tag
        # that no longer parses. Several real bugs in this project's history were
        # caught here first.
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        # -count=1 defeats the test cache, so a passing run means the tests ran.
        run: go test -count=1 ./...

  # ---------------------------------------------------------------------------
  # The race detector. Separate job because -race needs cgo and a C toolchain,
  # and because it is slower: keeping it out of the baseline job means a race
  # failure is clearly labelled rather than lost in a long log.
  #
  # This matters more than usual here. The console is a concurrent HTTP server
  # with a single-connection database, an in-memory mutex table and a supervisor
  # goroutine; a data race in that shape produces a wrong answer occasionally,
  # which is the worst kind of failure to debug from a bug report.
  # ---------------------------------------------------------------------------
  race:
    name: race detector (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test with the race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

  # ---------------------------------------------------------------------------
  # The ARMv7 artefacts, and the two properties the deliverable promises about
  # them: that they are statically linked, and that the build is reproducible.
  #
  # Reproducibility is checked by building twice with the same SOURCE_DATE_EPOCH
  # and comparing hashes. If the two differ, something in the build depends on
  # the environment, and the published checksum would not mean what it claims.
  # ---------------------------------------------------------------------------
  armv7:
    name: ARMv7 artefacts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build (first pass)
        run: SOURCE_DATE_EPOCH=1760000000 ./scripts/build-armv7.sh

      - name: Record the first hashes
        run: cp dist/SHA256SUMS /tmp/SHA256SUMS.first

      - name: Build (second pass, same epoch)
        run: SOURCE_DATE_EPOCH=1760000000 ./scripts/build-armv7.sh

      - name: Assert the build is reproducible
        run: |
          if ! diff -u /tmp/SHA256SUMS.first dist/SHA256SUMS; then
            echo "::error::two builds from the same source produced different bytes; the"
            echo "::error::published checksum would not identify the artefact"
            exit 1
          fi
          echo "reproducible: both builds produced identical hashes"

      - name: Verify the checksums
        run: sha256sum -c dist/SHA256SUMS

      - name: Assert the binaries are static and are ARM
        run: |
          fail=0
          for bin in dist/albumctl-linux-armv7 dist/nasctl-linux-armv7; do
            echo "--- $bin"
            # ELF 32-bit ARM EABI5.
            if ! file "$bin" | grep -q "ELF 32-bit LSB.*ARM"; then
              echo "::error::$bin is not a 32-bit ARM ELF"
              file "$bin"
              fail=1
            fi
            # No shared-library dependencies. This is what lets the binary run on
            # the target with nothing installed.
            if readelf -d "$bin" | grep -q NEEDED; then
              echo "::error::$bin has shared-library dependencies:"
              readelf -d "$bin" | grep NEEDED
              fail=1
            fi
            # No interpreter, i.e. not dynamically loaded.
            if readelf -l "$bin" | grep -q "interpreter"; then
              echo "::error::$bin has an ELF interpreter, so it is not static"
              fail=1
            fi
          done
          exit $fail

      - name: Smoke test under emulation
        # qemu is not the target, and this is a smoke test rather than a
        # measurement: it proves the binaries start, parse a real configuration
        # and index a tree, on a CPU that is not the one they were compiled for.
        # Nothing here is evidence about memory use or speed on the onecloud.
        #
        # The assertions are on the output rather than on the exit status alone:
        # a scan that indexed nothing also exits 0, and a smoke test that passes
        # when nothing happened is worse than no smoke test.
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static >/dev/null

          echo "--- version"
          qemu-arm-static dist/nasctl-linux-armv7 version
          qemu-arm-static dist/albumctl-linux-armv7 version

          echo "--- build the fixture and a configuration for it"
          go run ./internal/synth/cmdgen /tmp/lib
          mkdir -p /tmp/armstate
          cat > /tmp/arm.toml <<'EOF'
          [server]
          bind = "127.0.0.1:18091"
          [paths]
          state_dir = "/tmp/armstate"
          [guard]
          require_cgroup_isolation = false
          [[collections]]
          code = "lib"
          name = "Library"
          root = "/tmp/lib"
          enabled = true
          allow_shared_volume = true
          EOF

          echo "--- scan the fixture with the ARM binary"
          out="$(qemu-arm-static dist/albumctl-linux-armv7 scan \
                   --config /tmp/arm.toml --collection lib --limit 100)"
          echo "$out"

          # The fixture has 39 files, of which some are deliberately unsupported
          # or hidden. What matters is that a real walk happened and files were
          # indexed; the exact count is the fixture's business, not the CI's.
          if ! echo "$out" | grep -qE "entries:[[:space:]]+[1-9][0-9]* indexed"; then
            echo "::error::the ARM binary indexed no files; the smoke test would pass on a no-op"
            exit 1
          fi
          if echo "$out" | grep -qE "failed:[[:space:]]+[1-9]"; then
            echo "::error::the ARM scan reported failures"
            exit 1
          fi
          echo "the ARM binary indexed files and reported no failures"

      - uses: actions/upload-artifact@v4
        with:
          name: armv7-artefacts
          path: |
            dist/albumctl-linux-armv7
            dist/nasctl-linux-armv7
            dist/SHA256SUMS
            dist/README.txt
            dist/deps.txt
          # The build record is small; the binaries are ~12 MB each and are kept
          # for a week so a reviewer can download the exact artefact CI verified.
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The frontend, in a real DOM.
  #
  # Rebuild Svelte, verify committed assets, and render the real compiled bundle
  # against a synthetic library. The target NAS still needs no Node runtime.
  #
  # It cannot check layout: jsdom has no layout engine. Appearance still needs a
  # real browser, and the harness says so in its own output.
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend in a DOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build and check Svelte
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build
          git diff --exit-code -- ../internal/hubweb/web

      - name: Install the harness dependency
        working-directory: scripts/uitest
        run: npm install --no-audit --no-fund

      - name: Build the console
        run: go build -o /tmp/nasctl ./cmd/nasctl

      - name: Build a fixture library and a configuration for it
        run: |
          go run ./internal/synth/cmdgen /tmp/lib
          mkdir -p /tmp/hubstate /tmp/anime-downloads /tmp/anime-library
          cat > /tmp/hub.toml <<'EOF'
          [server]
          bind = "127.0.0.1:18090"
          # Disposable CI credential; never used by a deployed device.
          token = "nasctl-ci-fixture-operator"

          [paths]
          state_dir = "/tmp/hubstate"

          [hub]
          bind = "127.0.0.1:18090"

          [hub.anime]
          enabled = true
          qbittorrent_url = "http://127.0.0.1:18080"
          download_dir = "/tmp/anime-downloads"
          library_dir = "/tmp/anime-library"

          [[hub.storage]]
          id = "lib"
          label = "Library"
          path = "/tmp/lib"
          writable = true

          [[collections]]
          code = "lib"
          name = "Library"
          root = "/tmp/lib"
          EOF

      - name: Start the console
        run: |
          /tmp/nasctl --config /tmp/hub.toml serve > /tmp/console.log 2>&1 &
          # Wait for readiness rather than sleeping a fixed time: a fixed sleep is
          # either slower than necessary or occasionally too short.
          for i in $(seq 1 50); do
            if curl -sf -o /dev/null http://127.0.0.1:18090/api/v1/auth/status; then
              echo "console is up after ${i} attempts"
              exit 0
            fi
            sleep 0.2
          done
          echo "::error::the console did not become ready; its log follows"
          cat /tmp/console.log
          exit 1

      - name: Render the page
        working-directory: scripts/uitest
        run: node render.mjs http://127.0.0.1:18090 nasctl-ci-fixture-operator

      - name: Browser login, logout and draft preservation
        working-directory: scripts/uitest
        run: node auth.mjs http://127.0.0.1:18090 nasctl-ci-fixture-operator

      - name: Media playback controls and persistence
        run: |
          python3 scripts/uitest/seed-media.py /tmp/hubstate/anime.sqlite /tmp/anime-library --fixture-only
          node scripts/uitest/media.mjs http://127.0.0.1:18090 nasctl-ci-fixture-operator

      - name: Writable files, XHR upload, background copy/move and confirmed trash purge
        run: node scripts/uitest/files.mjs http://127.0.0.1:18090 nasctl-ci-fixture-operator

      - name: Finder navigation, tabs, pins, selection, menus and desktop search
        run: node scripts/uitest/finder.mjs http://127.0.0.1:18090 nasctl-ci-fixture-operator

      - name: Anime metadata selection and reversible subscription management
        run: node scripts/uitest/anime-management.mjs http://127.0.0.1:18090 nasctl-ci-fixture-operator

      - name: Desktop windows, drafts, geometry, mobile switching and session expiry
        run: node scripts/uitest/desktop.mjs http://127.0.0.1:18090 nasctl-ci-fixture-operator

      - name: Album browsing through two real services with generated fixtures
        run: |
          go build -o /tmp/albumctl ./cmd/albumctl
          go run ./scripts/uitest/seed-album --fixture-only --root /tmp/nasctl-ci-album
          /tmp/albumctl serve --config /tmp/nasctl-ci-album/album.toml > /tmp/album-fixture.log 2>&1 &
          /tmp/nasctl serve --config /tmp/nasctl-ci-album/hub.toml > /tmp/album-console.log 2>&1 &
          ready=0
          for i in $(seq 1 50); do
            if curl -sf -o /dev/null -H 'Authorization: Bearer nasctl-disposable-album-token' http://127.0.0.1:18095/api/v1/status && curl -sf -o /dev/null http://127.0.0.1:18096/api/v1/auth/status; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" = 1
          node scripts/uitest/album.mjs http://127.0.0.1:18096

      - name: Native album without a second HTTP service and real worker pause/resume
        run: |
          go run ./scripts/uitest/seed-album --fixture-only --root /tmp/nasctl-ci-native-album --hub-port 18099 --album-port 18100
          /tmp/nasctl serve --config /tmp/nasctl-ci-native-album/native.toml > /tmp/native-album.log 2>&1 &
          ready=0
          for i in $(seq 1 50); do
            if curl -sf -o /dev/null http://127.0.0.1:18099/api/v1/auth/status; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" = 1
          node scripts/uitest/album.mjs http://127.0.0.1:18099
          node scripts/uitest/album-native.mjs http://127.0.0.1:18099

      - name: Single-download controls, metadata versions and bounded history cleanup
        run: |
          mkdir -p /tmp/nasctl-ci-control/state /tmp/nasctl-ci-control/cache /tmp/nasctl-ci-control/downloads /tmp/nasctl-ci-control/library
          echo nasctl-ui-fixture-v1 > /tmp/nasctl-ci-control/.nasctl-ui-fixture
          cat > /tmp/nasctl-ci-control/config.toml <<'EOF'
          [server]
          bind = "127.0.0.1:18101"
          [paths]
          state_dir = "/tmp/nasctl-ci-control/state"
          cache_dir = "/tmp/nasctl-ci-control/cache"
          [hub.anime]
          enabled = true
          qbittorrent_url = "http://127.0.0.1:18102"
          download_dir = "/tmp/nasctl-ci-control/downloads"
          qbittorrent_download_dir = "/downloads/anime"
          library_dir = "/tmp/nasctl-ci-control/library"
          [[hub.storage]]
          id = "library"
          path = "/tmp/nasctl-ci-control/library"
          EOF
          node scripts/uitest/downloader-fixture.mjs --fixture-only --port 18102 > /tmp/control-downloader.log 2>&1 &
          /tmp/nasctl serve --config /tmp/nasctl-ci-control/config.toml > /tmp/control-console.log 2>&1 &
          ready=0
          for i in $(seq 1 50); do
            if curl -sf -o /dev/null http://127.0.0.1:18101/api/v1/auth/status && curl -sf -o /dev/null http://127.0.0.1:18102/__test/stats; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" = 1
          python3 - <<'PY'
          import sqlite3
          db=sqlite3.connect('/tmp/nasctl-ci-control/state/anime.sqlite')
          db.execute("INSERT INTO subscriptions(id,title,feed_url,season,enabled,auto_download) VALUES(1,'Generated Control Fixture','https://example.com/rss',1,1,0)")
          db.execute("INSERT INTO episodes(id,subscription_id,guid,title,url,number,season,state,hash,progress,updated_at,ever_submitted) VALUES(1,1,'generated-control','Generated Control Fixture - 01','https://example.com/fixture.torrent',1,1,'downloading',?,0.25,1,1)",('a'*40,))
          db.commit()
          db.close()
          PY
          node scripts/uitest/download-control.mjs http://127.0.0.1:18101 http://127.0.0.1:18102
          python3 scripts/uitest/seed-metadata.py /tmp/nasctl-ci-control --fixture-only
          node scripts/uitest/metadata.mjs http://127.0.0.1:18101
          node scripts/uitest/history.mjs http://127.0.0.1:18101

      - name: Console log on failure
        if: failure()
        run: |
          cat /tmp/console.log
          test ! -f /tmp/album-fixture.log || cat /tmp/album-fixture.log
          test ! -f /tmp/album-console.log || cat /tmp/album-console.log
          test ! -f /tmp/native-album.log || cat /tmp/native-album.log
          test ! -f /tmp/control-console.log || cat /tmp/control-console.log

      - name: Bounded Finder multiselect, conflict continuation, trash and restore
        run: |
          node scripts/uitest/cli-files.mjs /tmp/nasctl
          node scripts/uitest/cli-state.mjs /tmp/nasctl
          python3 scripts/uitest/seed-batch.py /tmp/nasctl-ci-batch --fixture-only
          /tmp/nasctl --config /tmp/nasctl-ci-batch/config.toml serve > /tmp/batch-console.log 2>&1 &
          batch_pid=$!
          trap 'kill "$batch_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 50); do
            if curl -sf -o /dev/null http://127.0.0.1:18103/api/v1/auth/status; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" = 1
          node scripts/uitest/batch.mjs http://127.0.0.1:18103
          node scripts/uitest/batch-history.mjs http://127.0.0.1:18103

      - name: Batch console log on failure
        if: failure()
        run: |
          test ! -f /tmp/batch-console.log || cat /tmp/batch-console.log

      - name: Native local backup, verified restore, conflicts and exact-ID cleanup
        run: |
          python3 scripts/uitest/seed-backup.py /tmp/nasctl-ci-backup --fixture-only
          /tmp/nasctl --config /tmp/nasctl-ci-backup/config.toml serve > /tmp/backup-console.log 2>&1 &
          backup_pid=$!
          trap 'kill "$backup_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 50); do
            if curl -sf -o /dev/null http://127.0.0.1:18104/api/v1/auth/status; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" = 1
          node scripts/uitest/backup.mjs http://127.0.0.1:18104

      - name: Unified settings workflow with generated private data
        run: |
          set -eu
          python3 scripts/uitest/seed-settings.py /tmp/nasctl-ci-settings --fixture-only
          /tmp/nasctl serve --config /tmp/nasctl-ci-settings/config.toml >/tmp/nasctl-ci-settings/server.log 2>&1 &
          settings_pid=$!
          trap 'kill "$settings_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18105/api/v1/settings >/dev/null; then break; fi
            sleep 0.1
          done
          node scripts/uitest/settings.mjs http://127.0.0.1:18105
          kill "$settings_pid"
          wait "$settings_pid" || true
          /tmp/nasctl serve --config /tmp/nasctl-ci-settings/config.toml >>/tmp/nasctl-ci-settings/server.log 2>&1 &
          settings_pid=$!
          for attempt in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18105/api/v1/settings >/dev/null; then break; fi
            sleep 0.1
          done
          node scripts/uitest/settings-restart.mjs http://127.0.0.1:18105

      - name: Settings console log on failure
        if: failure()
        run: test ! -f /tmp/nasctl-ci-settings/server.log || cat /tmp/nasctl-ci-settings/server.log

      - name: Local account CLI and corrupt-state recovery
        run: node scripts/uitest/cli-users.mjs /tmp/nasctl

      - name: Native album under delegated systemd and kernel memory limits
        run: ./scripts/verify-native-album-linux.sh --fixture-only /tmp

      - name: First setup, roles and account persistence
        run: |
          set -eu
          accounts_fixture="$(node scripts/uitest/seed-accounts.mjs /tmp/nasctl 18107)"
          /tmp/nasctl serve --config "$accounts_fixture/config.toml" >/tmp/nasctl-ci-accounts.log 2>&1 &
          accounts_pid=$!
          trap 'kill "$accounts_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18107/api/v1/auth/status >/dev/null; then break; fi
            sleep 0.1
          done
          node scripts/uitest/accounts.mjs "$accounts_fixture"
          kill "$accounts_pid"
          wait "$accounts_pid" || true
          /tmp/nasctl serve --config "$accounts_fixture/config.toml" >>/tmp/nasctl-ci-accounts.log 2>&1 &
          accounts_pid=$!
          for attempt in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18107/api/v1/auth/status >/dev/null; then break; fi
            sleep 0.1
          done
          node scripts/uitest/accounts-restart.mjs "$accounts_fixture"

      - name: Account console log on failure
        if: failure()
        run: test ! -f /tmp/nasctl-ci-accounts.log || cat /tmp/nasctl-ci-accounts.log

      - name: Backup console log on failure
        if: failure()
        run: |
          test ! -f /tmp/backup-console.log || cat /tmp/backup-console.log

  delivery:
    name: Linux package (${{ matrix.arch }})
    needs: [test, race, armv7, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, armv7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Package matched binaries, configuration and deployment docs
        env:
          NASCTL_ARCH: ${{ matrix.arch }}
        run: bash scripts/package-linux.sh "$NASCTL_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: nasctl-linux-${{ matrix.arch }}
          path: |
            dist/nasctl-linux-${{ matrix.arch }}.tar.gz
            dist/nasctl-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Delivery summary
        env:
          NASCTL_ARCH: ${{ matrix.arch }}
        run: |
          {
            echo "### Linux $NASCTL_ARCH"
            echo 'Matched nasctl + albumctl, configuration example, systemd unit and deployment docs.'
            echo 'Download the artifact above; verify its .tar.gz.sha256 before extracting.'
            echo 'This is a development build; installing on a NAS remains a separate step.'
            cat "dist/nasctl-linux-$NASCTL_ARCH.tar.gz.sha256"
          } >> "$GITHUB_STEP_SUMMARY"
